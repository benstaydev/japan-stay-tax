name: Publish to npm

# Trusted publishing (OIDC): no long-lived npm token lives in this repo.
# npm mints a short-lived credential from the OIDC token GitHub issues to this
# exact workflow, and attaches a provenance attestation — so npmjs.com shows
# "built from benstaydev/japan-stay-tax at <commit>". That verified link is the
# thing a cloned repo cannot forge, which matters here: a copy of this project
# was found distributing a Windows executable under the same name.
#
# Prerequisite: the package must already exist on npm and have this repository
# + workflow registered under Settings → Trusted Publisher. Trusted publishing
# cannot create an unscoped package that has never been published.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required — this is what lets npm verify the publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately no `registry-url`. With it, setup-node writes an
      # .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`; with no token set
      # that is an EMPTY credential, and npm then uses it instead of falling
      # back to OIDC — which surfaces as `E404 PUT .../japan-stay-tax` even
      # though the package plainly exists. Trusted publishing needs no .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm >= 11.5.1 is required for trusted publishing, and ubuntu-latest
      # still ships npm 10.x with Node 20 (which fails as a misleading
      # ENEEDAUTH). Pin the 11 line rather than @latest: npm 12 requires
      # Node >= 22 and refuses to install here with EBADENGINE.
      - run: npm install -g npm@^11.5.1

      # Diagnostic: proves the job really has an OIDC token available and a
      # new enough npm. If both are true and publishing still fails with
      # ENEEDAUTH, the mismatch is in the npm-side Trusted Publisher config.
      - name: Check OIDC prerequisites
        run: |
          echo "npm: $(npm -v)  node: $(node -v)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC: id-token available to this job ✓"
          else
            echo "OIDC: NO id-token — permissions.id-token: write is missing"; exit 1
          fi
          echo "repo=$GITHUB_REPOSITORY workflow_ref=$GITHUB_WORKFLOW_REF"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Refuse to publish a version that is already on the registry, rather
      # than failing halfway through.
      - name: Guard against republishing an existing version
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "japan-stay-tax@$V" version >/dev/null 2>&1; then
            echo "japan-stay-tax@$V is already published"; exit 1
          fi
          echo "publishing japan-stay-tax@$V"

      - run: npm publish --access public
